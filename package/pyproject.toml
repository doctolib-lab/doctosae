[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "medsae"
dynamic = ["version", "readme"]
description = "Sparse autoencoders for interpretable and transferable medical information retrieval"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gaëtan Brison" }, { name = "Diane Bouchacourt" }]
keywords = [
    "sparse autoencoder",
    "interpretability",
    "information retrieval",
    "medical",
    "embeddings",
    "explainability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.4",
    "huggingface_hub>=0.30,<3",
    "safetensors>=0.4.3",
    "jinja2>=3.1",
    "pyarrow>=16",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<4"]
# 4.50.0 maps Gemma 3 (google/medgemma-4b-it, the paper's LLM) to a class that cannot load it; 4.50.1 fixed it.
local-llm = ["transformers>=4.50.1", "accelerate>=0.33"]
gemini = ["google-genai>=1.0"]
# ruff is pinned to one minor version: CI checks the formatting, which may change between minor versions.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17,<0.18", "build>=1.2", "twine>=7"]

[project.urls]
Homepage = "https://github.com/doctolib-lab/medsae"
Repository = "https://github.com/doctolib-lab/medsae"
Issues = "https://github.com/doctolib-lab/medsae/issues"
"Hugging Face" = "https://huggingface.co/doctolib-lab"

[project.scripts]
medsae = "medsae.cli:main"

# README.md links the figure relatively so that GitHub renders it, private repository included. PyPI cannot resolve
# relative paths, so the published description points at the raw file of the public repository instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(\.\./\.github/assets/'
replacement = '](https://raw.githubusercontent.com/doctolib-lab/medsae/main/.github/assets/'

[tool.hatch.version]
path = "src/medsae/__init__.py"

# Files are chosen by the lists below, never by .gitignore: its patterns (data/, cache/, *.npy...) describe
# experiment outputs, and an unanchored data/ once dropped the medsae.data subpackage from the builds.
# Since .gitignore does not apply, the exclusions below keep credentials, run outputs and arrays that a local run
# may leave in examples/ or tests/ out of a locally built sdist. *.json is excluded on purpose: no JSON file
# ships today, and any future JSON package data must be added back with force-include, because this list
# applies to the wheel too.
[tool.hatch.build]
ignore-vcs = true
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".ipynb_checkpoints",
    ".DS_Store",
    ".env*",
    "*.json",
    "*.pem",
    "*.key",
    "runs/",
    "*.npy",
    "*.npz",
    "*.pkl",
    "*.pt",
    "*.pth",
    "*.safetensors",
    "*.parquet",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medsae"]

[tool.hatch.build.targets.sdist]
include = ["src/medsae", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads datasets or models from the Hugging Face Hub (deselect with -m 'not network')"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
