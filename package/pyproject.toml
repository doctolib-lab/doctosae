[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medsae"
dynamic = ["version"]
description = "Sparse autoencoders for interpretable and transferable medical information retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gaëtan Brison" }, { name = "Diane Bouchacourt" }]
keywords = [
    "sparse autoencoder",
    "interpretability",
    "information retrieval",
    "medical",
    "embeddings",
    "explainability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.4",
    "huggingface_hub>=0.30,<3",
    "safetensors>=0.4.3",
    "jinja2>=3.1",
    "pyarrow>=16",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<4"]
local-llm = ["transformers>=4.50", "accelerate>=0.33"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=7"]

[project.urls]
Homepage = "https://github.com/doctolib-lab/medsae"
Repository = "https://github.com/doctolib-lab/medsae"
Issues = "https://github.com/doctolib-lab/medsae/issues"
"Hugging Face" = "https://huggingface.co/doctolib-lab"

[project.scripts]
medsae = "medsae.cli:main"

[tool.hatch.version]
path = "src/medsae/__init__.py"

# Files are chosen by the lists below, never by .gitignore: its patterns (data/, cache/, *.npy...) describe
# experiment outputs, and an unanchored data/ once dropped the medsae.data subpackage from the builds.
[tool.hatch.build]
ignore-vcs = true
exclude = ["__pycache__", ".pytest_cache", ".ipynb_checkpoints", ".DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/medsae"]

[tool.hatch.build.targets.sdist]
include = ["src/medsae", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads datasets or models from the Hugging Face Hub (deselect with -m 'not network')"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
